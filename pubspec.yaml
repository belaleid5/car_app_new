name: car_app_new
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # Flutter
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.1.1
  
  # UI
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  
  # Utils
  connectivity_plus: ^7.0.0
  flutter_dotenv: ^6.0.0
  flutter_localization: ^0.3.3
  intl_phone_field: ^3.2.0
  shared_preferences: ^2.5.3
  visibility_detector: ^0.4.0+2
  
  # API
  retrofit: ^4.9.1
  dio: ^5.1.2
  json_annotation: ^4.8.0
  pretty_dio_logger: ^1.2.1
  
  # Dependency Injection
  get_it: ^9.2.0
  
  # Code Quality
  freezed_annotation: ^3.1.0
  very_good_analysis: ^10.0.0
  
  # Icons & Splash
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"

dev_dependencies:
  build_runner: ^2.10.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  retrofit_generator: 10.2.0  # ✅ أضفت الـ version
  json_serializable: ^6.6.1

flutter:
  uses-material-design: true

  assets:
    - .env.dev
    - .env.prod
    - assets/icons/
    - assets/images/
    - lang/ar.json
    - lang/en.json

  fonts:
    # Arabic Font
    - family: Cairo
      fonts:
        - asset: assets/fonts/arabic/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/arabic/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/arabic/cairo/Cairo-Regular.ttf
          weight: 400
    # English Font
    - family: Poppins
      fonts:
        - asset: assets/fonts/english/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/english/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/english/poppins/Poppins-Regular.ttf
          weight: 400